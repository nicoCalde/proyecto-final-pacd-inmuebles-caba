[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inmuebles"
version = "0.1.0"
description = "Segmentos de valor de departamentos en venta en CABA"
requires-python = ">=3.12"
# Sin dependencias: las versiones exactas están en requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
